name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Install FFmpeg & eSpeak-NG (Open-Source TTS)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng

      - name: Run Ruff linter
        run: uv run ruff check src tests

      - name: Run Pytest suite
        run: uv run pytest

      - name: Audit Open-Source Licenses & Validate Sample Config
        run: |
          uv run guideforge licenses --json
          uv run guideforge validate examples/guide.yaml --json
