[project]
name = "guideforge"
version = "0.4.0"
description = "100% Open-Source Client & Developer Manual Generator with Polyglot Code Runner (Node, Python, Go, Rust)"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = { text = "MIT" }
authors = [
  { name = "GuideForge Open Source Contributors" }
]
keywords = [
  "open-source",
  "user-manual",
  "developer-docs",
  "playwright",
  "piper-tts",
  "espeak-ng",
  "ffmpeg",
  "polyglot",
  "nodejs",
  "python",
  "golang",
  "rust",
  "antigravity",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Customer Service",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
# All runtime dependencies use permissive open-source licenses (MIT, Apache-2.0, HPND/BSD)
dependencies = [
  "pyyaml>=6.0.1",        # MIT License
  "pillow>=10.0.0",       # HPND (MIT-compatible Open Source License)
  "playwright>=1.42.0",   # Apache-2.0 License
  "python-docx>=1.1.0",   # MIT License
]

[project.optional-dependencies]
ui = [
  "nicegui>=2.5.0",       # MIT License (Open-source Python web UI + FastAPI server by Zauberzeug)
]
agent = [
  "browser-use>=0.1.40",  # MIT License (Open-source AI browser agent via raw CDP)
  "langchain-ollama>=0.2.0", # MIT License (Local open-source LLM connector for Ollama)
]
tts = [
  "piper-tts>=1.2.0; sys_platform == 'linux'", # MIT License (Linux wheel; on Windows/macOS use piper binary or kokoro-onnx/pyttsx3)
  "kokoro-onnx>=0.3.0",   # Apache-2.0 License (Open-weight local neural TTS)
  "pyttsx3>=2.90",        # MPL-2.0 License (Offline wrapper for espeak-ng)
]

[project.scripts]
guideforge = "guideforge.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0",        # MIT License
  "pytest-asyncio>=0.23.0", # Apache-2.0 License
  "ruff>=0.4.0",          # MIT License
  "mypy>=1.10.0",         # MIT License
  "types-PyYAML>=6.0.12", # Apache-2.0 License
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guideforge"]

[tool.uv]
managed = true
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true

